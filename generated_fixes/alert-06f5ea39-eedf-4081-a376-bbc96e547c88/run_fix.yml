---
- name: Remediate MySQL thread connection threshold breach
  hosts: localhost
  gather_facts: false
  vars:
    fix_script_path: "{{ playbook_dir }}/fix.py"
    mysql_host: "10.244.5.1"
    mysql_port: 3306
    mysql_user: "admin"
    mysql_password: "{{ lookup('env', 'MYSQL_PASSWORD') }}"
    idle_threshold_seconds: 300
    max_connections_threshold: 551

  tasks:
    - name: Execute MySQL connection remediation script
      ansible.builtin.script:
        cmd: "{{ fix_script_path }} --host {{ mysql_host }} --port {{ mysql_port }} --user {{ mysql_user }} --password {{ mysql_password }} --idle-threshold {{ idle_threshold_seconds }} --max-threshold {{ max_connections_threshold }}"
        executable: python3
      register: fix_result
      failed_when: fix_result.rc != 0

    - name: Display remediation output
      ansible.builtin.debug:
        var: fix_result.stdout_lines