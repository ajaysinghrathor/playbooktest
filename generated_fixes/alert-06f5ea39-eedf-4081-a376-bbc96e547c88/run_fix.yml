---
- name: Remediate MySQL high thread connections
  hosts: localhost
  gather_facts: false
  vars:
    fix_script_path: "{{ playbook_dir }}/fix.py"
    mysql_host: "10.244.5.1"
    mysql_port: 3306
    mysql_user: "{{ lookup('env', 'MYSQL_USER') | default('root', true) }}"
    mysql_password: "{{ lookup('env', 'MYSQL_PASSWORD') | default('', true) }}"
  tasks:
    - name: Execute MySQL thread remediation script
      ansible.builtin.script:
        cmd: "{{ fix_script_path }} --host {{ mysql_host }} --port {{ mysql_port }} --user {{ mysql_user }} --password {{ mysql_password }}"
        executable: python3
      register: fix_result
      changed_when: fix_result.rc == 0

    - name: Display remediation output
      ansible.builtin.debug:
        var: fix_result.stdout_lines