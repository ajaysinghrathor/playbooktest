---
- name: Remediate MySQL high thread connections
  hosts: localhost
  gather_facts: false
  vars:
    mysql_host: "{{ lookup('env', 'MYSQL_HOST') | default('10.244.5.1', true) }}"
    mysql_port: "{{ lookup('env', 'MYSQL_PORT') | default('3306', true) }}"
    mysql_user: "{{ lookup('env', 'MYSQL_USER') | default('admin', true) }}"
    mysql_password: "{{ lookup('env', 'MYSQL_PASSWORD') | default('', true) }}"
    max_idle_time: "{{ lookup('env', 'MAX_IDLE_TIME') | default('300', true) }}"
    thread_threshold: "{{ lookup('env', 'THREAD_THRESHOLD') | default('551', true) }}"

  tasks:
    - name: Execute MySQL connection cleanup script
      ansible.builtin.script:
        cmd: "fix.py --host {{ mysql_host }} --port {{ mysql_port }} --user {{ mysql_user }} --password {{ mysql_password }} --max-idle-time {{ max_idle_time }} --threshold {{ thread_threshold }}"
        executable: python3
      register: fix_result
      failed_when: fix_result.rc != 0

    - name: Display remediation output
      ansible.builtin.debug:
        var: fix_result.stdout_lines